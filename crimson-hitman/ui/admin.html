<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crimson Hitman Staff Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- The stylesheet and the script are loaded with a build query, as the
     phone page's are (ui/index.html): CEF caches by URL on its own disk, and
     this page's URL never changes, so a plain src kept the copy a staff
     member's game first saw through every update of the resource. The page
     is loaded once per start of the resource, so a stamp of the load is a
     fresh copy each start and one request for it. -->
<script>
  (function () {
    var build = (location.search.match(/[?&]v=([^&]+)/) || [])[1] || String(Date.now());
    window.CH_ADMIN_BUILD = decodeURIComponent(build);
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'admin.css?v=' + build;
    document.head.appendChild(css);
  })();
</script>
</head>
<body>
<!-- The staff panel. Hidden, and taking no input, until the client says it
     is open (client/admin.lua); every section is drawn by admin.js from what
     the server answers. Buttons only: nothing on it is a command. -->
<div id="panel" class="panel" role="dialog" aria-label="Crimson Hitman staff panel" hidden>
  <header class="bar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>Crimson Hitman <span class="muted">staff panel</span></h1>
      <span id="version" class="version"></span>
    </div>
    <div id="badges" class="badges"></div>
    <button id="close" class="icon-btn" type="button" data-act="close" title="Close (Esc)" aria-label="Close (Esc)">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i><span class="lbl">Close</span>
    </button>
  </header>
  <div id="banner" class="banner" role="status" hidden></div>
  <!-- Six sections, by who uses them; each holds the views it groups as
       sub-tabs (admin.js GROUPS). Developer is drawn only for staff who may
       open it, and is Permissions alone for everybody else. -->
  <nav id="nav" class="nav" aria-label="Sections">
    <button id="grp-live" class="nav-btn" type="button" data-act="group" data-group="live">
      <i class="fa-solid fa-gauge-high" aria-hidden="true"></i><span class="lbl">Live</span>
      <span id="count-live" class="nav-count is-warn" hidden></span>
    </button>
    <button id="grp-actions" class="nav-btn" type="button" data-act="group" data-group="actions">
      <i class="fa-solid fa-hand" aria-hidden="true"></i><span class="lbl">Staff actions</span>
    </button>
    <button id="grp-rules" class="nav-btn" type="button" data-act="group" data-group="rules">
      <i class="fa-solid fa-scale-balanced" aria-hidden="true"></i><span class="lbl">Rules</span>
      <span id="count-settings" class="nav-count" hidden></span>
    </button>
    <button id="grp-features" class="nav-btn" type="button" data-act="group" data-group="features">
      <i class="fa-solid fa-toggle-on" aria-hidden="true"></i><span class="lbl">Features</span>
    </button>
    <button id="grp-logs" class="nav-btn" type="button" data-act="group" data-group="logs">
      <i class="fa-solid fa-list-ul" aria-hidden="true"></i><span class="lbl">Logs &amp; alerts</span>
      <span id="count-logs" class="nav-count is-warn" hidden></span>
    </button>
    <button id="grp-developer" class="nav-btn" type="button" data-act="group" data-group="developer">
      <i class="fa-solid fa-code" aria-hidden="true"></i><span class="lbl">Developer</span>
    </button>
  </nav>
  <nav id="subnav" class="subnav" aria-label="In this section">
    <button id="nav-help" class="sub-btn" type="button" data-act="section" data-section="help" hidden>
      <i class="fa-solid fa-circle-question" aria-hidden="true"></i><span class="lbl">How it works</span>
    </button>
    <button id="nav-overview" class="sub-btn" type="button" data-act="section" data-section="overview" hidden>
      <i class="fa-solid fa-gauge-high" aria-hidden="true"></i><span class="lbl">Overview</span>
    </button>
    <button id="nav-contracts" class="sub-btn" type="button" data-act="section" data-section="contracts" hidden>
      <i class="fa-solid fa-file-contract" aria-hidden="true"></i><span class="lbl">Contracts</span>
    </button>
    <button id="nav-players" class="sub-btn" type="button" data-act="section" data-section="players" hidden>
      <i class="fa-solid fa-user" aria-hidden="true"></i><span class="lbl">Players</span>
    </button>
    <button id="nav-frozen" class="sub-btn" type="button" data-act="section" data-section="frozen" hidden>
      <i class="fa-solid fa-snowflake" aria-hidden="true"></i><span class="lbl">Frozen players</span>
    </button>
    <button id="nav-reviews" class="sub-btn" type="button" data-act="section" data-section="reviews" hidden>
      <i class="fa-solid fa-scale-balanced" aria-hidden="true"></i><span class="lbl">Needs review</span>
      <span id="count-reviews" class="nav-count is-warn" hidden></span>
    </button>
    <button id="nav-stuck" class="sub-btn" type="button" data-act="section" data-section="stuck" hidden>
      <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i><span class="lbl">Stuck escrow</span>
      <span id="count-stuck" class="nav-count is-warn" hidden></span>
    </button>
    <button id="nav-actions" class="sub-btn" type="button" data-act="section" data-section="actions" hidden>
      <i class="fa-solid fa-hand" aria-hidden="true"></i><span class="lbl">All staff actions</span>
    </button>
    <button id="nav-tools" class="sub-btn" type="button" data-act="section" data-section="tools" hidden>
      <i class="fa-solid fa-screwdriver-wrench" aria-hidden="true"></i><span class="lbl">Tools</span>
    </button>
    <button id="nav-announce" class="sub-btn" type="button" data-act="section" data-section="announce" hidden>
      <i class="fa-solid fa-bullhorn" aria-hidden="true"></i><span class="lbl">Announce</span>
    </button>
    <button id="nav-timers" class="sub-btn" type="button" data-act="section" data-section="timers" hidden>
      <i class="fa-solid fa-clock" aria-hidden="true"></i><span class="lbl">Timers</span>
    </button>
    <button id="nav-money" class="sub-btn" type="button" data-act="section" data-section="money" hidden>
      <i class="fa-solid fa-sack-dollar" aria-hidden="true"></i><span class="lbl">Rewards &amp; money</span>
    </button>
    <button id="nav-limits" class="sub-btn" type="button" data-act="section" data-section="limits" hidden>
      <i class="fa-solid fa-sliders" aria-hidden="true"></i><span class="lbl">Limits</span>
    </button>
    <button id="nav-targeting" class="sub-btn" type="button" data-act="section" data-section="targeting" hidden>
      <i class="fa-solid fa-crosshairs" aria-hidden="true"></i><span class="lbl">Targeting</span>
    </button>
    <button id="nav-features" class="sub-btn" type="button" data-act="section" data-section="features" hidden>
      <i class="fa-solid fa-toggle-on" aria-hidden="true"></i><span class="lbl">Switches</span>
    </button>
    <button id="nav-logs" class="sub-btn" type="button" data-act="section" data-section="logs" hidden>
      <i class="fa-solid fa-list-ul" aria-hidden="true"></i><span class="lbl">Logs</span>
    </button>
    <button id="nav-alerts" class="sub-btn" type="button" data-act="section" data-section="alerts" hidden>
      <i class="fa-solid fa-bell" aria-hidden="true"></i><span class="lbl">Alerts &amp; Discord</span>
      <span id="count-alerts" class="nav-count is-warn" hidden></span>
    </button>
    <button id="nav-devsettings" class="sub-btn" type="button" data-act="section" data-section="devsettings" hidden>
      <i class="fa-solid fa-gear" aria-hidden="true"></i><span class="lbl">Settings</span>
    </button>
    <button id="nav-console" class="sub-btn" type="button" data-act="section" data-section="console" hidden>
      <i class="fa-solid fa-terminal" aria-hidden="true"></i><span class="lbl">Console</span>
    </button>
    <button id="nav-diagnostics" class="sub-btn" type="button" data-act="section" data-section="diagnostics" hidden>
      <i class="fa-solid fa-stethoscope" aria-hidden="true"></i><span class="lbl">Diagnostics</span>
    </button>
    <button id="nav-permissions" class="sub-btn" type="button" data-act="section" data-section="permissions" hidden>
      <i class="fa-solid fa-key" aria-hidden="true"></i><span class="lbl">Permissions</span>
    </button>
    <button id="nav-history" class="sub-btn" type="button" data-act="section" data-section="history" hidden>
      <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i><span class="lbl">Settings history</span>
    </button>
  </nav>
  <main id="main" class="main"></main>
  <div id="scrim" class="scrim" data-act="drawer-close" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Contract" hidden></aside>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script>
  (function () {
    var js = document.createElement('script');
    js.src = 'admin.js?v=' + encodeURIComponent(window.CH_ADMIN_BUILD || 'dev');
    document.body.appendChild(js);
  })();
</script>
</body>
</html>
